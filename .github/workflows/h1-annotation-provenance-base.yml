name: H1 Annotation Provenance Base

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  annotation-provenance:
    name: H1 Annotation Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Controlled target annotation positive control
        shell: bash
        run: |
          echo H1_BASE_RUN_ATTEMPT=${{ github.run_attempt }}
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "::error file=h1-target-annotation.txt,line=1,col=1::H1_FOREIGN_ANNOTATION_ONLY_20260810"
            echo H1_TARGET_ANNOTATION_PRESENT_20260810
            exit 1
          fi
          echo H1_BASE_RETRY_SUCCESS_20260810
