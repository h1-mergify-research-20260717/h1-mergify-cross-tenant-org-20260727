name: H1 Auto Merge Hold

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  hold:
    name: H1 Auto Merge Hold
    runs-on: ubuntu-latest
    steps:
      - name: Hold revocation window
        run: sleep 90
      - name: Success marker
        run: echo H1_AUTO_MERGE_HOLD_OK_20260809
