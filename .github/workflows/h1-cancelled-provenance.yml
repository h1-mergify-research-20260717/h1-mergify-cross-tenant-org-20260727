name: H1 Cancelled Provenance

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  provenance:
    name: H1 Cancelled Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Hold cancellation window on push
        if: ${{ github.event_name == 'push' }}
        run: sleep 40
      - name: Pull request success
        if: ${{ github.event_name == 'pull_request' }}
        run: echo H1_UPSTREAM_CANCELLED_PROVENANCE_SUCCESS_20260810
