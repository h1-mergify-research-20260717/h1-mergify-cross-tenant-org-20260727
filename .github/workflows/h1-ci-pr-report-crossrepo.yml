name: H1 CI Insights PR Report Cross-Repo Control

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  h1-pr-report:
    name: H1 PR Report Public Failure
    runs-on: ubuntu-latest
    steps:
      - name: Write public JUnit with colliding test identity
        shell: bash
        run: |
          cat > h1-junit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="1">
            <testsuite name="h1.private.failure" tests="1" failures="1" time="0.100">
              <testcase classname="h1.private.failure" name="H1_PRIVATE_TEST_FAILURE_OBJECT_20260727" time="0.100">
                <failure message="AssertionError: H1_PUBLIC_CROSSJOIN_FAILURE_20260810" type="AssertionError">H1_PUBLIC_CROSSJOIN_STACK_20260810 at public/pr_report_control.py:11</failure>
              </testcase>
            </testsuite>
          </testsuites>
          XML
      - name: Upload to Mergify CI Insights
        uses: Mergifyio/gha-mergify-ci@v24
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: h1-junit.xml
