name: H1 Gate Current Secret Boundary

on:
  pull_request:
    branches:
      - h1-ci-pr-report-samerepo-20260810

permissions:
  contents: read

jobs:
  gate:
    name: H1 gate current secret consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository-controlled test entrypoint
        env:
          H1_GATE_CURRENT_CANARY: ${{ secrets.H1_MERGIFY_GATE_CURRENT_CANARY_20260814 }}
        run: bash ./h1-gate-current-secret-runner.sh
