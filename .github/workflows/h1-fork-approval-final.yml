name: H1 Fork Approval Final Boundary

on:
  pull_request:
    branches:
      - h1-fork-approval-final-target-20260813

permissions:
  contents: write

jobs:
  probe:
    name: H1 fork approval final boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute PR-controlled probe
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash h1-fork-approval-final-probe.sh
