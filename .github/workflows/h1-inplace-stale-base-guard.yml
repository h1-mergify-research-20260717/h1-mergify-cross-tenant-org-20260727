name: H1 InPlace Stale Base Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    name: H1 InPlace Stale Base Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate composed base and attacker state
        shell: bash
        run: |
          base_state="$(cat h1_inplace_base.txt 2>/dev/null || echo MISSING)"
          echo "H1_BASE_STATE=${base_state}"
          if [[ "$base_state" == "DENY" && -f h1_inplace_payload.txt ]]; then
            echo H1_INPLACE_STALE_BLOCK_20260809
            exit 1
          fi
          echo H1_INPLACE_STALE_OK_20260809
