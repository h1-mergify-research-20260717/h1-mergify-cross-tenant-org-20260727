name: H1 Live Freeze Hold

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  hold:
    name: H1 Live Freeze Hold
    runs-on: ubuntu-latest
    steps:
      - name: Hold live-freeze window
        run: sleep 45
      - name: Success marker
        run: echo H1_LIVE_FREEZE_SUCCESS_20260810
