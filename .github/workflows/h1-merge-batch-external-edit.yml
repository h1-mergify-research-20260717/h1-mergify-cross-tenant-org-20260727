name: H1 Merge Batch External Edit Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    name: H1 Merge Batch Guard
    runs-on: ubuntu-latest
    steps:
      - name: Hold batch edit window
        if: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: sleep 50
      - name: Guard success
        run: |
          echo H1_EVENT=${{ github.event_name }}
          echo H1_HEAD_REF=${{ github.head_ref }}
          echo H1_MERGE_BATCH_GUARD_SUCCESS_20260810
