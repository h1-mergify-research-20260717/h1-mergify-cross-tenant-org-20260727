name: H1 Mergify Secret Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  secret-probe:
    name: H1 Secret Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute attacker-controlled Mergify probe
        if: ${{ hashFiles('h1_mergify_secret_probe.sh') != '' }}
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: bash h1_mergify_secret_probe.sh
      - name: No probe in PR
        if: ${{ hashFiles('h1_mergify_secret_probe.sh') == '' }}
        run: echo H1_NO_SECRET_PROBE

  hold:
    name: H1 Secret Hold
    runs-on: ubuntu-latest
    steps:
      - name: Hold same-repository speculative validation
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: sleep 120
      - name: Fast fork control
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo H1_FORK_CONTROL_FAST
