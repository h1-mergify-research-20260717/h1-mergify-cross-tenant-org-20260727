name: H1 Mergify documented Test Insights secret boundary

on:
  pull_request:
    branches:
      - h1-mergify-ti-secret-target-20260813

permissions:
  contents: read

jobs:
  test-insights-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository tests with Mergify-style token environment
        env:
          MERGIFY_TOKEN: ${{ secrets.H1_MERGIFY_TI_CANARY_20260813 }}
        run: bash ./h1-mergify-documented-test-runner.sh

