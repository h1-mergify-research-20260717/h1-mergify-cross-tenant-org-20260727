name: H1 Public CI Report Control

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  public-report-failure:
    name: H1 Public PR Report Failure
    runs-on: ubuntu-latest
    steps:
      - name: Public canary failure
        run: |
          echo H1_PUBLIC_PR_REPORT_FAILURE_20260809
          exit 1
