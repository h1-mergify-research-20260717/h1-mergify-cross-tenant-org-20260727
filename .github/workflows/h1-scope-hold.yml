name: H1 Scope Hold

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  hold:
    name: H1 Scope Hold
    runs-on: ubuntu-latest
    steps:
      - name: Hold scope-recomposition window
        run: sleep 60
      - name: Fail-safe stop
        run: |
          echo H1_SCOPE_HOLD_FAILSAFE_20260809
          exit 1
