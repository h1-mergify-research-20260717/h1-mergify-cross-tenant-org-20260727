name: H1 Skip-Off Normal Path Control

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  safety:
    name: H1 skip-off normal-path control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate deterministic non-monotonic state
        shell: bash
        run: |
          if [[ -f h1-skip-off-bug.txt && ! -f h1-skip-off-fix.txt ]]; then
            echo "H1_SKIP_OFF_BUG_WITHOUT_FIX_20260810"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              sleep 90
            fi
            exit 1
          fi
          echo "H1_SKIP_OFF_SAFE_20260810"
