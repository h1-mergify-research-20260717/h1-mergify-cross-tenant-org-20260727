name: H1 Fork Provenance Trusted Workflow Ref Boundary

on:
  pull_request:
    branches:
      - h1-fork-prov-trusted-workflow-target-20260812

permissions:
  contents: write

jobs:
  trusted-probe:
    name: H1 fork provenance trusted ref boundary
    runs-on: ubuntu-latest
    steps:
      - name: Trusted fixed base-repository ref write probe
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -u
          ref='refs/heads/h1-fork-prov-trusted-ref-canary-20260812'
          payload="$(printf '{"ref":"%s","sha":"%s"}' "$ref" "$H1_REF_SHA")"
          status="$(curl --silent --show-error --output /tmp/h1-response.json --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $H1_GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$H1_REPOSITORY/git/refs" --data "$payload")"
          rm -f /tmp/h1-response.json
          echo "H1_TRUSTED_REF_CREATE_STATUS=$status"
          if [[ "$status" == '201' ]]; then echo 'H1_TRUSTED_REF_CREATE_SUCCEEDED=true'; else echo 'H1_TRUSTED_REF_CREATE_SUCCEEDED=false'; fi
