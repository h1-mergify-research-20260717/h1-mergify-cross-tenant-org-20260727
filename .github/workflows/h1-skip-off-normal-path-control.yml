name: H1 Fork Provenance Head-Repo Trust Gate

on:
  pull_request:
    branches:
      - h1-fork-prov-headrepo-trust-target-20260812

jobs:
  observe-provenance:
    name: H1 head-repo provenance observer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record GitHub PR provenance
        env:
          H1_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          H1_BASE_REPO: ${{ github.repository }}
          H1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          H1_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          echo "H1_HEAD_REPO=$H1_HEAD_REPO"
          echo "H1_BASE_REPO=$H1_BASE_REPO"
          echo "H1_HEAD_SHA=$H1_HEAD_SHA"
          echo "H1_HEAD_FORK=$H1_HEAD_FORK"
          if [[ "$H1_HEAD_REPO" == "$H1_BASE_REPO" ]]; then
            echo "H1_TRUST_PREDICATE=true"
          else
            echo "H1_TRUST_PREDICATE=false"
          fi

  trusted-publish:
    name: H1 trusted same-repo publisher
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish trusted PR head under fixed base-repository ref
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -u
          ref='refs/heads/h1-fork-prov-headrepo-trust-canary-20260812'
          payload="$(printf '{\"ref\":\"%s\",\"sha\":\"%s\"}' "$ref" "$H1_REF_SHA")"
          status="$(curl --silent --show-error --output /tmp/h1-response.json --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $H1_GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$H1_REPOSITORY/git/refs" --data "$payload")"
          rm -f /tmp/h1-response.json
          echo "H1_TRUSTED_REF_TARGET_SHA=$H1_REF_SHA"
          echo "H1_TRUSTED_REF_CREATE_STATUS=$status"
          if [[ "$status" == '201' ]]; then
            echo 'H1_TRUSTED_REF_CREATE_SUCCEEDED=true'
          else
            echo 'H1_TRUSTED_REF_CREATE_SUCCEEDED=false'
          fi
