name: H1 Fork Provenance Ref Boundary Fresh

on:
  pull_request:
    branches:
      - h1-fork-prov-ref-target-20260812

permissions:
  contents: write

jobs:
  probe:
    name: H1 fork provenance ref boundary fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute pull-request-controlled ref probe
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash h1-fork-prov-ref-probe.sh
