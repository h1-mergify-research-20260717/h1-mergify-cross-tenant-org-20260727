name: H1 Mergify fork-origin CI trigger

on:
  pull_request:
    branches:
      - h1-fork-prov-workflow-run-target-20260813

permissions:
  contents: read

jobs:
  ci:
    name: H1 fork-origin CI trigger
    runs-on: ubuntu-latest
    steps:
      - name: Record triggering pull request context
        env:
          H1_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          H1_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          H1_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          H1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          H1_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          echo "H1_CI_PR=$H1_PR_NUMBER"
          echo "H1_CI_HEAD_REPO=$H1_HEAD_REPO"
          echo "H1_CI_HEAD_FORK=$H1_HEAD_FORK"
          echo "H1_CI_HEAD_REF=$H1_HEAD_REF"
          echo "H1_CI_HEAD_SHA=$H1_HEAD_SHA"
          echo "H1_CI_RESULT=success"
