name: H1 Stale Guard Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  stale-guard:
    name: H1 Stale Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hold validation window
        run: sleep 25
      - name: Validate composed state
        shell: bash
        run: |
          base_state="$(cat h1_reset_base.txt 2>/dev/null || echo ALLOW)"
          if [[ "$base_state" == "DENY" && -f h1_reset_payload.txt ]]; then
            echo "H1_STALE_COMPOSITION_BLOCK_20260809"
            exit 1
          fi
          echo "H1_STALE_COMPOSITION_OK_20260809"
