name: H1 Mergify documented workflow_run fork guard

on:
  workflow_run:
    workflows:
      - H1 Mergify fork-origin CI trigger
    types:
      - completed

permissions:
  contents: read

jobs:
  observe:
    name: H1 workflow-run security observer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record workflow_run trust context
        env:
          H1_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          H1_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          H1_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          H1_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          H1_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          echo "H1_WORKFLOW_RUN_CONCLUSION=$H1_CONCLUSION"
          echo "H1_WORKFLOW_RUN_HEAD_REPO=$H1_HEAD_REPO"
          echo "H1_WORKFLOW_RUN_HEAD_BRANCH=$H1_HEAD_BRANCH"
          echo "H1_WORKFLOW_RUN_HEAD_SHA=$H1_HEAD_SHA"
          echo "H1_WORKFLOW_RUN_TRIGGER_EVENT=$H1_TRIGGER_EVENT"
          if [[ "$H1_CONCLUSION" == "success" && "$H1_HEAD_REPO" == "${{ github.repository }}" ]]; then
            echo "H1_DOCUMENTED_GUARD=true"
          else
            echo "H1_DOCUMENTED_GUARD=false"
          fi

  trusted-publish:
    name: H1 documented head-repo guarded secret publisher
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish harmless repository-secret canary only for trusted CI origin
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.workflow_run.head_sha }}
          H1_CANARY_SECRET: ${{ secrets.H1_FORK_ORIGIN_SECRET_20260813 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$H1_CANARY_SECRET"

          branch='h1-fork-prov-workflow-run-canary-20260813'
          ref="refs/heads/$branch"
          ref_payload="$(printf '{\"ref\":\"%s\",\"sha\":\"%s\"}' "$ref" "$H1_REF_SHA")"
          ref_status="$(curl --silent --show-error --output /tmp/h1-ref-response.json --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $H1_GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$H1_REPOSITORY/git/refs" --data "$ref_payload")"
          rm -f /tmp/h1-ref-response.json
          echo "H1_SECRET_REF_CREATE_STATUS=$ref_status"
          test "$ref_status" = '201'

          secret_b64="$(printf '%s' "$H1_CANARY_SECRET" | base64 -w0)"
          file_payload="$(jq -cn --arg message 'H1 harmless secret canary publication 20260813' --arg content "$secret_b64" --arg branch "$branch" '{message:$message,content:$content,branch:$branch}')"
          file_status="$(curl --silent --show-error --output /tmp/h1-file-response.json --write-out '%{http_code}' --request PUT --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $H1_GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$H1_REPOSITORY/contents/h1-workflow-run-secret-canary-20260813.txt" --data "$file_payload")"
          rm -f /tmp/h1-file-response.json
          echo "H1_SECRET_FILE_CREATE_STATUS=$file_status"
          test "$file_status" = '201'
          echo 'H1_SECRET_CANARY_PUBLISHED=true'
