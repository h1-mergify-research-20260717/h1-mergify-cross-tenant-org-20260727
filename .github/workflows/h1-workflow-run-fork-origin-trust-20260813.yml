name: H1 Mergify documented workflow_run fork guard

on:
  workflow_run:
    workflows:
      - H1 Mergify fork-origin CI trigger
    types:
      - completed

permissions:
  contents: read

jobs:
  observe:
    name: H1 workflow-run security observer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record workflow_run trust context
        env:
          H1_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          H1_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          H1_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          H1_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          H1_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          echo "H1_WORKFLOW_RUN_CONCLUSION=$H1_CONCLUSION"
          echo "H1_WORKFLOW_RUN_HEAD_REPO=$H1_HEAD_REPO"
          echo "H1_WORKFLOW_RUN_HEAD_BRANCH=$H1_HEAD_BRANCH"
          echo "H1_WORKFLOW_RUN_HEAD_SHA=$H1_HEAD_SHA"
          echo "H1_WORKFLOW_RUN_TRIGGER_EVENT=$H1_TRIGGER_EVENT"
          if [[ "$H1_CONCLUSION" == "success" && "$H1_HEAD_REPO" == "${{ github.repository }}" ]]; then
            echo "H1_DOCUMENTED_GUARD=true"
          else
            echo "H1_DOCUMENTED_GUARD=false"
          fi

  trusted-publish:
    name: H1 documented head-repo guarded publisher
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish workflow_run head under fixed base-repository ref
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_REF_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/heads/h1-fork-prov-workflow-run-canary-20260813'
          payload="$(printf '{\"ref\":\"%s\",\"sha\":\"%s\"}' "$ref" "$H1_REF_SHA")"
          status="$(curl --silent --show-error --output /tmp/h1-response.json --write-out '%{http_code}' --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $H1_GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$H1_REPOSITORY/git/refs" --data "$payload")"
          rm -f /tmp/h1-response.json
          echo "H1_WORKFLOW_RUN_REF_TARGET_SHA=$H1_REF_SHA"
          echo "H1_WORKFLOW_RUN_REF_CREATE_STATUS=$status"
          echo "H1_WORKFLOW_RUN_REF_CREATE_SUCCEEDED=$([[ "$status" == '201' ]] && echo true || echo false)"
