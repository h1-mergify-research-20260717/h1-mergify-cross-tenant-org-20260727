pull_request_rules:
  - name: H1 org installation processing control
    conditions:
      - title = H1_ORG_MERGIFY_INSTALLATION_CONTROL_20260727
    actions:
      comment:
        message: H1_ORG_MERGIFY_INSTALLATION_MARKER_20260727
  - name: H1 cross-tenant no-relation control
    conditions:
      - title = H1_CROSS_TENANT_NO_RELATION_CONTROL_20260727
    actions:
      comment:
        message: H1_CROSS_TENANT_NO_RELATION_MARKER_20260727
        bot_account: onecursora1-cell

  - name: H1 external-fork isolated queue trigger 20260813
    conditions:
      - base = h1-stack-predecessor-no-label-20260809
      - from-fork
    actions:
      queue:
  - name: H1 internal-only from-fork protected marker 20260813
    conditions:
      - base = h1-stack-predecessor-no-label-20260809
      - -from-fork
    actions:
      label:
        add:
          - H1_FROM_FORK_NATIVE_INTERNAL_ONLY_20260813

commands_restrictions:
  queue:
    conditions:
      - sender = onecursor3-gif

queue_rules:
  - name: h1-from-fork-native-live-20260813
    queue_conditions:
      - base = h1-stack-predecessor-no-label-20260809
    merge_conditions:
      - label = H1_NEVER_MERGE_FROM_FORK_NATIVE_20260813
    branch_protection_injection_mode: merge
    batch_size: 1
    merge_method: squash
  - name: h1-skip-off-control
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = @github-actions/H1 skip-off normal-path control
    branch_protection_injection_mode: merge
    batch_size: 1
    merge_method: squash

merge_queue:
  mode: serial
  max_parallel_checks: 2
  skip_intermediate_results: false
  queue_controls_comment: false
