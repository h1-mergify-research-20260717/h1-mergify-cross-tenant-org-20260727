pull_request_rules:
  - name: H1 org installation processing control
    conditions:
      - title = H1_ORG_MERGIFY_INSTALLATION_CONTROL_20260727
    actions:
      comment:
        message: H1_ORG_MERGIFY_INSTALLATION_MARKER_20260727
  - name: H1 cross-tenant no-relation control
    conditions:
      - title = H1_CROSS_TENANT_NO_RELATION_CONTROL_20260727
    actions:
      comment:
        message: H1_CROSS_TENANT_NO_RELATION_MARKER_20260727
        bot_account: onecursora1-cell

commands_restrictions:
  queue:
    conditions:
      - sender = onecursor3-gif

queue_rules:
  - name: h1-gitrefs-protected-ci-20260814
    queue_conditions:
      - base = h1-gitrefs-target-20260814
    merge_conditions:
      - check-success = @github-actions/H1 gitrefs protected gate 20260814
    branch_protection_injection_mode: merge
    batch_size: 1
    merge_method: fast-forward

  - name: h1-skip-off-control
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = @github-actions/H1 skip-off normal-path control
    branch_protection_injection_mode: merge
    batch_size: 1
    merge_method: squash

  - name: h1-exp067-checkbox-1786819310
    queue_conditions:
      - base = h1-exp067-checkbox-1786819310
    merge_conditions:
      - check-success = H1_EXP067_IMPOSSIBLE_1786819310
    branch_protection_injection_mode: merge
    batch_size: 1
    batch_max_wait_time: 30
    merge_method: squash
    allow_queue_branch_edit: false

merge_queue:
  mode: serial
  max_parallel_checks: 2
  skip_intermediate_results: false
  queue_controls_comment: true
