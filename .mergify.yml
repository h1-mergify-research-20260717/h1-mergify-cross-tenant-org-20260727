pull_request_rules:
  - name: H1 org installation processing control
    conditions:
      - title = H1_ORG_MERGIFY_INSTALLATION_CONTROL_20260727
    actions:
      comment:
        message: H1_ORG_MERGIFY_INSTALLATION_MARKER_20260727
  - name: H1 cross-tenant no-relation control
    conditions:
      - title = H1_CROSS_TENANT_NO_RELATION_CONTROL_20260727
    actions:
      comment:
        message: H1_CROSS_TENANT_NO_RELATION_MARKER_20260727
        bot_account: onecursora1-cell


  - name: H1 independent secret team bot-account live control 20260811
    conditions:
      - title = H1_SECRET_INDEPENDENT_BOT_CONTROL_20260811
    actions:
      request_reviews:
        users_from_teams:
          - h1-secret-independent-20260811
        bot_account: onecursor3-gif

  - name: H1 independent secret team app-authority live test 20260811
    conditions:
      - title = H1_SECRET_INDEPENDENT_APP_TEST_20260811
    actions:
      request_reviews:
        users_from_teams:
          - h1-secret-independent-20260811

commands_restrictions:
  queue:
    conditions:
      - sender = onecursor3-gif

queue_rules:
  - name: h1-skip-off-control
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = @github-actions/H1 skip-off normal-path control
    branch_protection_injection_mode: merge
    batch_size: 1
    merge_method: squash

merge_queue:
  mode: serial
  max_parallel_checks: 2
  skip_intermediate_results: false
  queue_controls_comment: false
